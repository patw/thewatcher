name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Build & test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: thewatcher

      - name: Checkout moofile (path dependency)
        uses: actions/checkout@v4
        with:
          repository: beholder/moofile
          path: moofile

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            thewatcher -> thewatcher/target
            moofile/core -> moofile/core/target

      - name: Check
        working-directory: thewatcher
        run: cargo check

      - name: Build
        working-directory: thewatcher
        run: cargo build

      - name: Test
        working-directory: thewatcher
        run: cargo test
